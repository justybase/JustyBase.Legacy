name: UI tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preferences-ui:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout shared JustyBase libraries
        uses: actions/checkout@v7
        with:
          repository: justybase/JustyBase.NetezzaSql
          ref: master
          path: JustyBase.NetezzaSql

      - name: Stage shared libraries beside repository
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'JustyBase.NetezzaSql'
          $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'JustyBase.NetezzaSql'
          Copy-Item -Path $source -Destination $destination -Recurse -Force
          $requiredProject = Join-Path $destination 'JustyBase.NetezzaSqlParser.csproj'
          if (-not (Test-Path -LiteralPath $requiredProject)) {
            throw "Shared JustyBase project was not staged at the expected sibling path: $requiredProject"
          }

      - name: Verify shared library package references
        shell: pwsh
        run: ./scripts/verify-no-internal-justybase-nugets.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301

      - name: Restore and build UI test target
        run: dotnet build tests/JustData.UiTests/JustData.UiTests.csproj -c Release

      - name: Run FlaUI preferences test
        run: dotnet test tests/JustData.UiTests/JustData.UiTests.csproj -c Release --no-build --results-directory artifacts/ui-test-results --logger "trx;LogFileName=ui-tests.trx"

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: artifacts/ui-test-results
          if-no-files-found: warn
          retention-days: 14
