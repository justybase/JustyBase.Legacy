name: Create Release

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

env:
  SOLUTION_FILE: JustData.All.slnx
  APP_PROJECT: JustData/JustData.csproj
  INNO_SCRIPT: JustData/Installers/Offline/OfflineInstaller.iss
  SETUP_FILES_PATH: JustData/JD_TEMP/SetupFilesTmp
  DOTNET_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.301'

    - name: Get version from tag
      id: get_version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Restore solution
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Audit NuGet dependencies
      run: dotnet list ${{ env.APP_PROJECT }} package --vulnerable --include-transitive --no-restore

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} -c Release --no-restore -p:Platform=${{ env.DOTNET_PLATFORM }}

    - name: Smoke test Release build
      run: dotnet run --project ${{ env.APP_PROJECT }} -c Release -p:Platform=${{ env.DOTNET_PLATFORM }} --no-build --no-launch-profile -- --smoke-test

    - name: Run core tests with coverage
      run: dotnet test tests/AppBase.Tests/AppBase.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory artifacts/test-results/AppBase.Tests

    - name: Run ViewModels tests with coverage
      run: dotnet test tests/JustData.ViewModels.Tests/JustData.ViewModels.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory artifacts/test-results/JustData.ViewModels.Tests

    - name: Run Preferences tests with coverage
      run: dotnet test tests/JustData.Preferences.Tests/JustData.Preferences.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory artifacts/test-results/JustData.Preferences.Tests

    - name: Run Login tests with coverage
      run: dotnet test tests/JustData.Login.Tests/JustData.Login.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory artifacts/test-results/JustData.Login.Tests

    - name: Merge coverage reports
      shell: pwsh
      run: ./scripts/merge-cobertura-coverage.ps1 -ResultsDirectory artifacts/test-results -OutputFile artifacts/coverage/coverage.cobertura.xml

    - name: Enforce core coverage threshold
      shell: pwsh
      run: |
        ./scripts/check-core-coverage.ps1 `
          -CoverageFile artifacts/coverage/coverage.cobertura.xml `
          -MinimumLineRatePercent 46 `
          -MinimumAssemblyLineRates @(
            'App.Data.Netezza=18',
            'AppBase.Services=35'
          ) `
          -MarkdownReportPath artifacts/coverage/coverage-summary.md

    - name: Check whitespace
      run: git diff --check

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Publish Windows application (Native AOT)
      run: |
        dotnet publish ${{ env.APP_PROJECT }} `
          -r win-x64 `
          -c Release `
          -p:Platform=${{ env.DOTNET_PLATFORM }} `
          -o ./${{ env.SETUP_FILES_PATH }} `
          -p:Version=${{ steps.get_version.outputs.version }} `
          -p:UseAOT=true `
          --self-contained true

    - name: Remove PDB files from publish output
      shell: pwsh
      run: |
        $publishPath = Join-Path $pwd "${{ env.SETUP_FILES_PATH }}"
        Get-ChildItem -Path $publishPath -Filter "*.pdb" -Recurse -File -ErrorAction SilentlyContinue |
          Remove-Item -Force

    - name: Verify published application
      run: |
        $publishPath = Join-Path $pwd "${{ env.SETUP_FILES_PATH }}"
        $executable = Join-Path $publishPath "JustyBaseLegacy.exe"
        if (-not (Test-Path -LiteralPath $executable)) {
          throw "Application executable was not produced: $executable"
        }
        if ((Get-Item -LiteralPath $executable).Length -le 0) {
          throw "Application executable is empty: $executable"
        }
        Write-Host "Verified application: $executable"

        $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -PassThru
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          throw "Application startup smoke test timed out."
        }
        if ($process.ExitCode -ne 0) {
          throw "Application startup smoke test failed with exit code $($process.ExitCode)."
        }
        Write-Host "Application startup smoke test passed."

    - name: Create Installers
      run: |
        $setupFilesPath = Join-Path $pwd ${{ env.SETUP_FILES_PATH }}
        $innoScript = Join-Path $pwd ${{ env.INNO_SCRIPT }}

        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
          "$innoScript" `
          "/DMyAppVersion=${{ steps.get_version.outputs.version }}" `
          "/DSourcePath=$setupFilesPath"

    - name: Create ZIP packages
      run: |
        Compress-Archive -Path "./${{ env.SETUP_FILES_PATH }}/*" -DestinationPath "./JustyBaseLegacy-${{ steps.get_version.outputs.version }}.zip"

    - name: Verify release packages
      run: |
        $zip = Join-Path $pwd "JustyBaseLegacy-${{ steps.get_version.outputs.version }}.zip"
        if (-not (Test-Path -LiteralPath $zip)) {
          throw "ZIP package was not produced: $zip"
        }
        $installers = Get-ChildItem -Path "./JustData/Installers/Offline/Output" -Filter "*.exe" -File -ErrorAction SilentlyContinue
        if ($installers.Count -eq 0) {
          throw "No installer executable was produced."
        }

    - name: Prepare release notes
      id: release_notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
        $escaped = [regex]::Escape($version)
        $pattern = "(?ms)^## \[$escaped\].*?(?=^## \[|\z)"
        $match = [regex]::Match($changelog, $pattern)
        if ($match.Success) {
          $body = $match.Value.Trim()
        } else {
          $body = "## JustyBaseLegacy $version`n`nSee CHANGELOG.md for details."
        }
        $body | Out-File -FilePath release-notes.md -Encoding utf8

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./JustData/Installers/Offline/Output/*.exe
          ./JustyBaseLegacy-${{ steps.get_version.outputs.version }}.zip
        name: Release ${{ steps.get_version.outputs.version }}
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
